<body class="sub"><header class="id"><a href="index.html"><strong>Aaradhana Venkatesan</strong><span>MSc Behavioural Science.</span></a></header>
<main class="wrap"><h1>Recommend me something</h1><p class="lede">Art is different for everyone. Music, podcasts, films, books: if something changed how you see the world, I want to hear about it.</p>
<form class="item" name="recommendations" method="POST" data-netlify="true" netlify-honeypot="bot-field">
<input type="hidden" name="form-name" value="recommendations"><p hidden><label>Leave this empty <input name="bot-field"></label></p>
<p><label>Your name (optional)<br><input name="name" autocomplete="name"></label></p>
<p><label>What is it?<br><select name="type"><option>Music</option><option>Podcast</option><option>Film or series</option><option>Book</option><option>Event</option><option>Person to learn from</option><option>Something else</option></select></label></p>
<p><label>Title and who made it<br><input name="title" required></label></p>
<p><label>Why should I listen, watch or read it?<br><textarea name="why" rows="4" required></textarea></label></p>
<p><button type="submit" class="more">Send it my way</button></p></form></main>
